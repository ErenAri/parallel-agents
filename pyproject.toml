[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-agents"
version = "0.4.3"
description = "Parallel multi-agent pipeline for code analysis and transformation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Parallel Agents Team"},
]
maintainers = [
    {name = "Parallel Agents Team"},
]
keywords = ["ai", "agents", "claude", "code-analysis", "parallel", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.52.0",
    "claude-code-sdk>=0.0.10",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.20.0",
]
gateway = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0,<0.42.0",
    "uvicorn>=0.32.0",
]
desktop = [
    "PySide6>=6.7.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0,<0.42.0",
    "uvicorn>=0.32.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.0.0",
    "mcp>=1.20.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0,<0.42.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/ErenAri/parallel-agents"
Repository = "https://github.com/ErenAri/parallel-agents"
Issues = "https://github.com/ErenAri/parallel-agents/issues"
Changelog = "https://github.com/ErenAri/parallel-agents/blob/main/CHANGELOG.md"
Compatibility = "https://github.com/ErenAri/parallel-agents/blob/main/COMPATIBILITY.md"

[project.scripts]
parallel-agents = "parallel_agents.main:cli"
parallel-agents-mcp = "parallel_agents.mcp_server:run_server"
parallel-agents-desktop = "parallel_agents.desktop.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_agents"]

[tool.hatch.build.targets.sdist]
include = [
    "src/parallel_agents",
    "README.md",
    "VISION.md",
    "PRFAQ.md",
    "PROJECT_STATUS.md",
    "OPERATING_MODEL.md",
    "QUALITY_BAR.md",
    "TECH_STACK_POLICY.md",
    "ROADMAP.md",
    "docs/workflows/*.md",
    "CHANGELOG.md",
    "COMPATIBILITY.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "SUPPORT.md",
    "examples/*.json",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
