name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # 1. Run tests first
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -e ".[dev]"
          python -m pytest tests/ -v

  # 2. Publish to PyPI
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # 3. Publish npm wrapper
  npm:
    needs: pypi  # wait for PyPI so postinstall can find the package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # 4. Build standalone binaries for all platforms
  binaries:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: parallel-agents-linux-x86_64
            ext: ""
          - os: macos-latest
            artifact: parallel-agents-macos-arm64
            ext: ""
          - os: windows-latest
            artifact: parallel-agents-windows-x86_64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: pyinstaller --noconfirm parallel-agents.spec

      - name: Rename artifact
        run: |
          mv "dist/parallel-agents${{ matrix.ext }}" "dist/${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.ext }}

  # 5. Create GitHub Release with binaries
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/parallel-agents-linux-x86_64/parallel-agents-linux-x86_64
            artifacts/parallel-agents-macos-arm64/parallel-agents-macos-arm64
            artifacts/parallel-agents-windows-x86_64/parallel-agents-windows-x86_64.exe
